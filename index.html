<!doctype html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#197568"><meta name="description" content="Terokai tiga kotak misteri dan kenali kata adjektif perasaan. Permainan Bahasa Melayu Tahun 4."><title>Kotak Misteri Digital · Bahasa Melayu Tahun 4</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><div class="shell"><header class="topbar"><div class="audio-controls"><button id="music" aria-pressed="true">♫ <span>Muzik ON</span></button><button id="sound" aria-pressed="true">♪ <span>Bunyi ON</span></button></div></header>
<main><section class="intro"><h1>KOTAK MISTERI <span>DIGITAL</span></h1><p>Klik kotak misteri dan jawab soalan.</p></section>
<section class="game-panel" aria-label="Kotak misteri"><div class="panel-heading"><div><h2>3 kotak, 3 perasaan!</h2></div><div class="coin-count"><span class="coin">★</span><span><b id="coin-total">0</b> / 3<small>SYILING HARTA</small></span></div></div><div class="boxes" id="boxes"></div><div class="progress-area"><div class="progress-copy"><span id="progress-text" aria-live="polite">Kotak Selesai: 0/3</span><span id="encourage">Mari mulakan pengembaraan!</span></div><div class="progress-track" role="progressbar" aria-label="Kotak selesai" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><div id="progress-fill"></div></div></div></section>
</main></div>
<dialog id="question-dialog" aria-labelledby="question-title"><div class="modal-top"><span id="box-tag" class="eyebrow"></span><button id="close-question" class="close" aria-label="Kembali ke kotak misteri">×</button></div><div class="question-layout"><div class="scene-wrap"><img id="scene" alt=""><span class="image-caption">PERHATIKAN GAMBAR INI</span></div><div class="question-content"><span class="small-label">PILIH SATU JAWAPAN</span><h2 id="question-title"></h2><div id="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button class="primary" id="next" hidden>Kembali ke Kotak Misteri →</button></div></div></dialog>
<dialog id="final-dialog" aria-labelledby="final-title"><div class="final-content"><div class="trophy" aria-hidden="true">✦</div><h2 id="final-title">TAHNIAH, MURID!</h2><p>Kamu telah berjaya membuka ketiga-tiga Kotak Misteri!</p><div id="final-boxes" class="final-boxes"></div><p class="reward">3 syiling harta berjaya dikumpul!</p><div class="final-characters"><img src="assets/05_three_characters.png" alt="Briar, Bramble dan Logger Vick meraikan kejayaan"></div><button id="restart" class="primary">↻ &nbsp; MAIN SEMULA</button></div></dialog><div id="confetti" aria-hidden="true"></div></body></html>
